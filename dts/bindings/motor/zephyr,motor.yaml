description: |
  Common compatible of a motor driven through the motor API.

  A motor node lists its implementation compatible first and this one
  second, so consumers enumerate motors without knowing the implementation.
  Each implementation binding includes this one and adds its own properties.

compatible: "zephyr,motor"

include: base.yaml
