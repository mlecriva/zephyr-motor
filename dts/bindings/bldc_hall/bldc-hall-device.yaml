description: |
  Common properties of a bldc_hall three-line Hall acquisition device.

include: base.yaml

properties:
  hall-gpios:
    type: phandle-array
    required: true
    description: |
      The three Hall sensor lines, in U/V/W order: this order alone defines
      the phases.
