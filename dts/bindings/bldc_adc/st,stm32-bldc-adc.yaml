description: |
  STM32 three-channel PWM-synchronized ADC acquisition.

  Runs a three-rank injected conversion group on one ADC, triggered in hardware
  once per PWM period by the TRGO2 of the bridge named in the pwm property.
  The three conversions therefore always land at the same point in the
  switching cycle.

compatible: "st,stm32-bldc-adc"

include: [bldc-adc-device.yaml]
