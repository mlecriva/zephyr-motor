sample:
  name: Motor driver shell
  description: >
    Drive a motor open-loop and read its feedback from the shell, using the
    motor driver directly with no motor control subsystem
tests:
  sample.driver.motor:
    build_only: true
    platform_allow:
      - nucleo_g431rb
    integration_platforms:
      - nucleo_g431rb
    tags: motor
